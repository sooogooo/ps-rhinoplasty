<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="鼻整形插图"><defs><linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0a6cb8"/><stop offset="100%" stop-color="#7ec3eb"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#d4a437"/><stop offset="100%" stop-color="#e8c068"/></linearGradient></defs><rect width="1200" height="520" fill="#f4f9fc"/><text x="40" y="64" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="700" fill="#1c2b39">鼻子要恢复多久</text><rect x="40" y="80" width="120" height="6" rx="3" fill="url(#blue)"/><g transform="translate(60,150)"><rect width="500" height="330" rx="16" fill="#fff" stroke="#d6e1ea"/><line x1="90" y1="40" x2="90" y2="300" stroke="#0a6cb8" stroke-width="4" stroke-linecap="round"/><circle cx="90" cy="50" r="12" fill="#0a6cb8"/><text x="115" y="48" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="700" fill="#1c2b39">第1周</text><text x="115" y="68" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#5a6c7c">肿胀·淤青·鼻夹板</text><circle cx="90" cy="130" r="12" fill="#0a6cb8"/><text x="115" y="128" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="700" fill="#1c2b39">2-4周</text><text x="115" y="148" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#5a6c7c">部分消退</text><circle cx="90" cy="205" r="12" fill="#0a6cb8"/><text x="115" y="203" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="700" fill="#1c2b39">1-3月</text><text x="115" y="223" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#5a6c7c">逐步自然</text><circle cx="90" cy="280" r="12" fill="#0a6cb8"/><text x="115" y="278" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="700" fill="#1c2b39">6月以上</text><text x="115" y="298" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#5a6c7c">逐渐稳定</text></g><g transform="translate(640,150)"><rect width="500" height="330" rx="16" fill="#fff" stroke="#d6e1ea"/><text x="26" y="46" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="#d4a437">恢复快慢因人而异</text><text x="26" y="100" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#5a6c7c">基础条件、范围、是否合并功能手术</text><text x="26" y="136" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#5a6c7c">会影响恢复与最终形态</text><rect x="26" y="180" width="440" height="70" rx="12" fill="#fff7ea" stroke="#f0c05a"/><text x="46" y="228" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#8a6d1c">恢复与鼻型稳定需时间，不能几天就定型</text></g><text x="600" y="500" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#7a8a98">把恢复期分成阶段看，管理预期</text></svg>