<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="鼻整形插图"><defs><linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0a6cb8"/><stop offset="100%" stop-color="#7ec3eb"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#d4a437"/><stop offset="100%" stop-color="#e8c068"/></linearGradient></defs><rect width="1200" height="520" fill="#f4f9fc"/><text x="40" y="64" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="700" fill="#1c2b39">鼻部：结构与功能</text><rect x="40" y="80" width="120" height="6" rx="3" fill="url(#blue)"/><g transform="translate(60,150)"><rect width="1080" height="280" rx="16" fill="#fff" stroke="#d6e1ea"/><text x="60" y="46" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" fill="#0a6cb8">外鼻结构</text><text x="60" y="100" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#5a6c7c">鼻梁 · 鼻尖 · 鼻翼</text><text x="60" y="140" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#5a6c7c">鼻骨 · 鼻小柱</text><text x="60" y="190" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#5a6c7c">鼻中隔软骨 · 下外侧软骨</text><line x1="560" y1="40" x2="560" y2="250" stroke="#d6e1ea" stroke-width="2"/><text x="600" y="46" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" fill="#d4a437">功能</text><text x="600" y="100" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#5a6c7c">通气 · 加湿 · 嗅觉</text><text x="600" y="140" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#5a6c7c">鼻塞可能来自结构或黏膜</text><text x="600" y="190" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#5a6c7c">形态与功能常需一起考虑</text></g><text x="600" y="492" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#7a8a98">鼻整形理解结构与功能，才能不只盯着外观</text></svg>